# ASP.NET Core
# Build and test ASP.NET Core projects targeting .NET Core.
# Add steps that run tests, create a NuGet package, deploy, and more:
# https://docs.microsoft.com/azure/devops/pipelines/languages/dotnet-core

trigger:
- master

pool:
  vmImage: ubuntu-latest

variables:
  buildConfiguration: 'Release'

steps:
- script: dotnet publish Smart.SolarMicrogridTradingSystem.Api/Smart.SolarMicrogridTradingSystem.Api.csproj --configuration $(buildConfiguration) --output $(Build.ArtifactStagingDirectory)/api
  displayName: 'dotnet publish API'

- publish: $(Build.ArtifactStagingDirectory)/api
  artifact: api

- script: dotnet publish Smart.SolarMicrogridTradingSystem.Web/Smart.SolarMicrogridTradingSystem.Web.csproj --configuration $(buildConfiguration) --output $(Build.ArtifactStagingDirectory)/web
  displayName: 'dotnet publish Web'

- publish: $(Build.ArtifactStagingDirectory)/web
  artifact: web
